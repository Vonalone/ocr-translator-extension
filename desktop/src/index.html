<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screen OCR Translator Desktop</title><link rel="stylesheet" href="./style.css"></head><body>
<main><h1>Screen OCR Translator</h1><p class="hint">Live Arabic subtitles for Boosteroid</p>
<div id="status" role="status">Loading…</div>
<label>Game window<select id="source"></select></label><button id="refresh" type="button">Refresh windows</button><label>Overlay monitor<select id="display"></select></label>
<label>Translation provider<select id="provider"><option value="google">Google</option><option value="deepl">DeepL</option><option value="openai">LLM (OpenAI compatible)</option></select></label>
<section id="deepl-options"><label>DeepL API key<input id="deeplKey" type="password" autocomplete="off"></label><label>Plan<select id="deeplPlan"><option value="free">Free</option><option value="pro">Pro</option></select></label></section>
<section id="llm-options"><label>LLM API base URL<input id="llmBaseUrl" type="url" placeholder="http://localhost:1234/v1"></label><label>API key<input id="llmKey" type="password" autocomplete="off"></label><label>Model<input id="llmModel" placeholder="model name"></label></section>
<div class="grid"><label>Font size <output id="fontSizeValue"></output><input id="fontSize" type="range" min="16" max="96"></label><label>Opacity <output id="opacityValue"></output><input id="opacity" type="range" min="10" max="100"></label><label>Bottom offset <output id="bottomValue"></output><input id="bottom" type="range" min="0" max="45"></label><label>Horizontal center <output id="horizontalValue"></output><input id="horizontal" type="range" min="5" max="95"></label></div>
<details><summary>Capture region</summary><p class="hint">Adjust this to cover the English subtitle area in the Boosteroid window.</p><label>Region starts at <output id="cropTopValue"></output><input id="cropTop" type="range" min="0" max="90"></label><label>Region height <output id="cropHeightValue"></output><input id="cropHeight" type="range" min="5" max="100"></label><label>Region width <output id="cropWidthValue"></output><input id="cropWidth" type="range" min="20" max="100"></label></details>
<button id="toggle" class="primary" type="button">Start live subtitles</button>
<button id="openLogs" type="button">Open logs</button>
<p class="hint">Ctrl+Alt+S: start/stop · Ctrl+Alt+O: hide/show subtitles<br>Ctrl+Alt+↑/↓: font size</p>
<p id="latest" lang="ar" dir="rtl" aria-live="polite"></p></main><script type="module" src="./renderer.ts"></script></body></html>
